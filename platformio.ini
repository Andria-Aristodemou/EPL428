[platformio]
default_envs = gps_student
boards_dir = boards

[env]
platform = espressif32@6.12.0
board = t-beams3-supreme
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_ldf_mode = deep+

lib_deps =
  https://github.com/lewisxhe/SensorLib.git


build_flags =
  -DLILYGO_TBeamS3_SUPREME_V3_0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

[env:gps_student]
build_src_filter = +<gps_student.cpp>

[env:lora_receiver]
build_src_filter = +<lora_receiver.cpp>
